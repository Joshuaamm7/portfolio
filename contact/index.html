<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Joshua Huang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <style>
    /* ── Page header ───────────────────────────────────────── */
    .contact-header {
      padding: 1rem 0 1rem;
      border-bottom: 2px solid var(--color-accent);
      margin-bottom: 2rem;
    }

    .contact-header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 0.4rem;
      line-height: 1.1;
    }

    .contact-sub {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text-muted);
      margin: 0 0 1.1rem;
    }

    /* ── Direct contact links ──────────────────────────────── */
    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .contact-link {
      display: inline-block;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid color-mix(in oklch, var(--accent), transparent 60%);
      padding: 0.28em 0.85em;
      border-radius: 2em;
      transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
    }

    .contact-link:hover {
      background: color-mix(in oklch, var(--accent), transparent 88%);
      border-color: var(--accent);
    }

    /* ── Form card ─────────────────────────────────────────── */
    .contact-form-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-m);
      box-shadow: var(--shadow-1);
      padding: 1.5rem 1.75rem;
    }

    .form-intro {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-accent);
      margin: 0 0 1.1rem;
    }

    /* ── Input styling ─────────────────────────────────────── */
    input,
    textarea {
      padding: 0.5em 0.75em;
      border: 1px solid var(--border);
      border-radius: var(--radius-s);
      background: var(--bg);
      color: var(--text);
      width: 100%;
      transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-muted);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent), transparent 75%);
    }

    /* ── Submit button ─────────────────────────────────────── */
    button[type="submit"] {
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: var(--radius-s);
      padding: 0.5em 1.75em;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: auto;
      margin: 0.25em 0 0;
      justify-self: start;
      transition: background var(--dur-1) var(--ease);
    }

    button[type="submit"]:hover {
      background: var(--accent-strong);
    }
  </style>
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="contact-header">
    <h1>Get in Touch</h1>
    <p class="contact-sub">
      I'd love to hear from you — whether it's about a project, an opportunity, or just to connect.
    </p>
    <div class="contact-links">
      <a href="mailto:joh095@ucsd.edu" class="contact-link">joh095@ucsd.edu</a>
      <a href="https://linkedin.com/in/joshuahuang22" class="contact-link" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      <a href="https://github.com/joshuaamm7" class="contact-link" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </header>

  <!-- ── Form card ───────────────────────────────────────────── -->
  <div class="contact-form-wrap">
    <p class="form-intro">Send a message</p>

    <form action="mailto:joh095@ucsd.edu" method="POST" enctype="text/plain">

      <label>
        Your Email:
        <input name="email" type="email" placeholder="you@example.com" required>
      </label>

      <label>
        Subject:
        <input name="subject" required>
      </label>

      <label>
        Message:
        <textarea name="body" rows="5" placeholder="Write your message…"></textarea>
      </label>

      <button type="submit">Send Message</button>

    </form>
  </div>

</body>
</html>
